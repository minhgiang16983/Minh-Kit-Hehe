syntax = "proto3";
package pb;

option go_package = "/api;pb";

import "third_party/google/api/annotations.proto";

import "health.proto";
import "models.proto";

service ServiceKit {
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/health",
    };
  }
  rpc GetSample(GetSampleRequest) returns (GetSampleResponse) {
    option (google.api.http) = {
      get: "/sample",
    };
  }
}
